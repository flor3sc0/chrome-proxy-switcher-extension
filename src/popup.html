<!DOCTYPE html>
<html lang="en">

<head>
    <title>Proxy switch with whitelist</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>

<body>
    <div id="error-message" class="error hidden" aria-live="polite"></div>
    <div id="toggle-container">
        <label class="switch">
            <input type="checkbox" id="toggleProxy">
            <span class="slider round"></span>
        </label>
        <div id="status-container">
            <span id="currentStatus">State: INACTIVE</span>
            <span id="statusIcon"></span>
        </div>
    </div>
    <div id="settings-container">
        <h3>Settings</h3>
        <div>
            <label for="proxyHost">Host:</label>
            <input type="text" id="proxyHost">
        </div>
        <div>
            <label for="proxyPort">Port:</label>
            <input type="number" id="proxyPort">
        </div>
        <div>
            <input type="checkbox" id="useAnywhere">
            <label for="useAnywhere">Use anywhere</label>
        </div>
        <div id="whitelist-container">
            <div>
                <input type="checkbox" id="addYbDomains">
                <label for="addYbDomains">Add <b>Youtube</b> domains to whitelist</label>
            </div>
            <div class="field-label-row">
                <label for="customWhiteList"><b>Whitelist</b></label>
                <button type="button" id="addCurrentDomain" class="compact-button" data-keep-enabled="true">+ current site</button>
            </div>
            <div>
                <textarea id="customWhiteList" placeholder="example.org, *.example.com"></textarea>
            </div>
        </div>
        <div id="blacklist-container">
            <div>
                <label for="customBlackList"><b>Blacklist</b>:</label>
                <textarea id="customBlackList" placeholder="example.org, *.example.com"></textarea>
            </div>
        </div>
    </div>
    <script src="helpers/constants.js"></script>
    <script src="popup.js"></script>
</body>

</html>
